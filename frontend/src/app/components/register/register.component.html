<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>

    <div class="requirements">
      <p><strong>Username:</strong> letters and numbers only</p>
      <p>
        <strong>Password:</strong> at least 8 characters, one uppercase letter, one lowercase
        letter, and one number
      </p>
      <p><strong>Age:</strong> you must be at least 13 years old</p>
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    @if (errors.length > 0) {
      <div class="error-message">
        <ul>
          @for (error of errors; track error) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter your username" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
    </div>

    <div class="form-group">
      <label>Birth Date</label>
      <input type="date" [(ngModel)]="birthDate" />
    </div>

    <div class="form-buttons">
      <button class="btn btn-primary" (click)="onRegister()">Register</button>
      <button class="btn btn-secondary" (click)="goBack()">Back</button>
    </div>
  </div>
</div>
