<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>

    <!-- Error message (US2b) -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Login form -->
    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter your username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
    </div>

    <div class="form-buttons">
      <button class="btn btn-primary" (click)="onLogin()">Login</button>
      <button class="btn btn-secondary" (click)="goBack()">Back</button>
    </div>

    <div class="register-link">
      <p>Don't have an account? <a (click)="goBack()">Register here</a></p>
    </div>
  </div>
</div>
