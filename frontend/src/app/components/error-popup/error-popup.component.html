@if (errorPopup.visible() || isClosing) {
  <div class="overlay" [class.closing]="isClosing" (click)="onBackdropClick()">
    <div class="popup" [class.closing]="isClosing" (click)="onPopupClick($event)">
      <div class="popup-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <p class="popup-message">{{ errorPopup.message() }}</p>
      <button class="popup-close" (click)="onCloseClick()" aria-label="Close">&#10005;</button>
    </div>
  </div>
}
