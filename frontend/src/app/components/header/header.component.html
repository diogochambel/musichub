<nav class="header">
  <div class="header-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">PSI Music</a>

    <button
      class="hamburger"
      [class.active]="menuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links" [class.open]="menuOpen">
      <button
        class="theme-toggle"
        (click)="toggleTheme(); closeMenu()"
        [attr.aria-label]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
        [title]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
      >
        @if (theme() === 'light') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        }
      </button>

      @if (isLoggedIn()) {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="closeMenu()">
          Dashboard
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </a>

        <a
          routerLink="/notifications"
          routerLinkActive="active"
          class="nav-link notification-link"
          [class.has-unread]="unreadCount() > 0"
          aria-label="Notifications"
          title="Notifications"
          (click)="closeMenu()"
        >
          Notifications
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"
            />
            <path d="M10 21a2 2 0 0 0 4 0" />
          </svg>
          @if (unreadCount() > 0) {
            <span class="notification-badge"></span>
          }
        </a>

        <a routerLink="/profile" routerLinkActive="active" class="nav-link username" (click)="closeMenu()">
          {{ username() }}
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </a>

        <div class="auth-buttons">
          <button class="btn btn-secondary" (click)="logout()">Logout</button>
        </div>
      } @else {
        <div class="auth-buttons">
          <a routerLink="/login" class="btn btn-secondary" (click)="closeMenu()">Login</a>
          <a routerLink="/register" class="btn btn-primary" (click)="closeMenu()">Register</a>
        </div>
      }
    </div>
  </div>
</nav>
